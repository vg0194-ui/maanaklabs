services:
  - type: web
    runtime: static
    name: maanak-labs-web
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: frontend/dist
    autoDeployTrigger: commit
    domains:
      - www.maanaklabs.com
    envVars:
      - key: VITE_API_URL
        value: https://api.maanaklabs.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    runtime: node
    name: maanak-labs-api
    plan: starter
    branch: main
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    domains:
      - api.maanaklabs.com
    envVars:
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://www.maanaklabs.com
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEFAULT_ADMIN_NAME
        sync: false
      - key: DEFAULT_ADMIN_EMAIL
        sync: false
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: DEFAULT_ADMIN_MOBILE
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: LAB_CONTACT_MOBILE
        sync: false
      - key: LAB_CONTACT_EMAIL
        sync: false
